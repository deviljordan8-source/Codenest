<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a0" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c6200" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0" />
    </linearGradient>
    <filter id="nest-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#b8860b" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Hexagon Nest -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0d1117" stroke="url(#gold-grad)" stroke-width="2.5" filter="url(#nest-shadow)" />
  
  <!-- Background subtle grid dots -->
  <circle cx="24" cy="24" r="1.5" fill="#d4af37" opacity="0.3" />
  <circle cx="76" cy="24" r="1.5" fill="#d4af37" opacity="0.3" />
  <circle cx="24" cy="76" r="1.5" fill="#d4af37" opacity="0.3" />
  <circle cx="76" cy="76" r="1.5" fill="#d4af37" opacity="0.3" />
  
  <!-- Interlocking Code Brackets & Nest Core -->
  <!-- Left Bracket < -->
  <path d="M 40 32 L 26 50 L 40 68" stroke="url(#gold-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 60 32 L 74 50 L 60 68" stroke="url(#gold-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Nest Lattice / Slash / Node -->
  <!-- Diagonal Slash -->
  <path d="M 54 30 L 46 70" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  
  <!-- Inner glowing node -->
  <circle cx="50" cy="50" r="5" fill="url(#gold-grad)" />
  <circle cx="50" cy="50" r="8" stroke="#d4af37" stroke-width="1.5" opacity="0.5" />
</svg>
